openapi: 3.1.0
info:
  title: Commitly Local Semantic Report API
  version: 0.2.0
  description: Loopback-only API for local semantic analysis of selected Git activity.
servers:
  - url: /api/v1
tags:
  - name: Repositories
  - name: Reports
paths:
  /repositories:
    get:
      tags: [Repositories]
      summary: List explicitly selected repositories and remote-check status
      responses:
        '200':
          description: Selected repositories.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Repository'
    post:
      tags: [Repositories]
      summary: Register a user-selected local repository
      description: Validates a local Git worktree and configured remote. Does not scan any other path.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RepositoryInput'
      responses:
        '201':
          description: Repository registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Repository'
        '400':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /repositories/{repository_id}:
    parameters:
      - name: repository_id
        in: path
        required: true
        schema:
          type: string
    delete:
      tags: [Repositories]
      summary: Remove a selected repository source
      description: Previously generated report evidence remains available.
      responses:
        '204':
          description: Repository registration removed.
        '404':
          $ref: '#/components/responses/NotFound'
  /activity/refresh:
    post:
      tags: [Reports]
      summary: Refresh selected repositories and generate daily reports
      description: Attempts fetch without pushing. Cached refs are used offline or after fetch errors. Semantic analysis and document extraction run locally only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Per-repository fetch and analysis outcomes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
        '409':
          description: External report modification detected; preserve both versions for explicit resolution.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportConflict'
        '422':
          $ref: '#/components/responses/Problem'
  /reports:
    get:
      tags: [Reports]
      summary: List dates with saved reports
      responses:
        '200':
          description: Available report dates, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  format: date
  /settings:
    get:
      tags: [Reports]
      summary: Read local workspace, theme, and analyzer configuration
      responses:
        '200':
          description: Local application settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
    patch:
      tags: [Reports]
      summary: Update theme or local model CLI configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsPatch'
      responses:
        '200':
          description: Updated local settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        '422':
          $ref: '#/components/responses/Problem'
  /reports/{date}:
    parameters:
      - name: date
        in: path
        required: true
        schema:
          type: string
          format: date
    get:
      tags: [Reports]
      summary: Read a saved daily report and its evidence
      responses:
        '200':
          description: Daily report and Markdown revision.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyReport'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Problem'
  /reports/{date}/context:
    parameters:
      - name: date
        in: path
        required: true
        schema:
          type: string
          format: date
    put:
      tags: [Reports]
      summary: Add or update one-line user-reported context
      description: Send one text line to add/update or null to remove context. Context is shown in Điểm chính with explicit user attribution and is not treated as Git-derived evidence.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserContextInput'
      responses:
        '200':
          description: Updated daily report.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyReport'
        '409':
          description: Report changed externally; preserve both versions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportConflict'
        '422':
          $ref: '#/components/responses/Problem'
  /reports/{date}/conflicts/{conflict_id}:
    parameters:
      - name: date
        in: path
        required: true
        schema:
          type: string
          format: date
      - name: conflict_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Reports]
      summary: Read both versions of an externally changed report
      responses:
        '200':
          description: External Markdown and generated report candidate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportConflict'
        '404':
          $ref: '#/components/responses/NotFound'
  /reports/{date}/conflicts/{conflict_id}/resolve:
    parameters:
      - name: date
        in: path
        required: true
        schema:
          type: string
          format: date
      - name: conflict_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Reports]
      summary: Save the user's explicit conflict resolution
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/DailyReport'
                - type: object
                  required: [date, keep_external]
                  properties:
                    date:
                      type: string
                      format: date
                    keep_external:
                      type: boolean
                      const: true
      responses:
        '200':
          description: Resolved report saved.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyReport'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: A newer external edit was detected; neither version was overwritten.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportConflict'
        '422':
          $ref: '#/components/responses/Problem'
components:
  parameters:
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag from the latest report read or conflict state.
      schema:
        type: string
  headers:
    ETag:
      description: Quoted SHA-256 revision of the Markdown report.
      schema:
        type: string
  responses:
    Problem:
      description: Invalid repository, unsupported content, analysis failure, or persistence error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Repository, report, or conflict does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    RepositoryInput:
      type: object
      required: [path]
      properties:
        path:
          type: string
          minLength: 1
        remote_name:
          type: [string, 'null']
          description: Defaults to origin if present; otherwise must select a configured remote.
        display_name:
          type: [string, 'null']
    Repository:
      type: object
      required: [id, path, display_name, remote_name, author_email, last_fetch_status]
      properties:
        id:
          type: string
        path:
          type: string
        display_name:
          type: string
        remote_name:
          type: string
        author_email:
          type: string
        last_fetch_at:
          type: [string, 'null']
          format: date-time
        last_fetch_status:
          type: string
          enum: [success, failed, never]
        last_error:
          type: [string, 'null']
          description: Sanitized message without credentials.
    RefreshRequest:
      type: object
      required: [from, to]
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        repository_ids:
          type: array
          items:
            type: string
          description: Omit to refresh all selected repositories.
    RefreshResponse:
      type: object
      required: [from, to, repositories]
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        repositories:
          type: array
          items:
            type: object
            required: [repository_id, fetch_status, analysis_status, report_dates]
            properties:
              repository_id:
                type: string
              fetch_status:
                type: string
                enum: [success, failed, cached]
              last_verified_at:
                type: [string, 'null']
                format: date-time
              analysis_status:
                type: string
                enum: [complete, partial, unavailable]
              report_dates:
                type: array
                items:
                  type: string
                  format: date
              error:
                type: [string, 'null']
    EvidenceLog:
      type: object
      required: [id, repository_id, repository_name, repository_path, commit_id, authored_at, changed_paths, analysis_status]
      properties:
        id:
          type: string
          format: uuid
        repository_id:
          type: string
        repository_name:
          type: string
        repository_path:
          type: string
        commit_id:
          type: string
        authored_at:
          type: string
          format: date-time
        subject:
          type: string
        changed_paths:
          type: array
          items:
            type: string
        added_lines:
          type: [integer, 'null']
          minimum: 0
        deleted_lines:
          type: [integer, 'null']
          minimum: 0
        analysis_status:
          type: string
          enum: [complete, partial, unsupported, failed]
        analysis_note:
          type: [string, 'null']
    ReportClaim:
      type: object
      required: [id, text, evidence_ids, certainty]
      properties:
        id:
          type: string
          format: uuid
        text:
          type: string
        evidence_ids:
          type: array
          items:
            type: string
            format: uuid
        certainty:
          type: string
          enum: [supported, uncertain]
    DailyReport:
      type: object
      required: [date, summary, highlights, details, evidence, user_context, analysis_status]
      properties:
        date:
          type: string
          format: date
        summary:
          $ref: '#/components/schemas/ReportClaim'
        highlights:
          type: array
          items:
            $ref: '#/components/schemas/ReportClaim'
        details:
          type: array
          items:
            $ref: '#/components/schemas/ReportClaim'
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/EvidenceLog'
        user_context:
          type: array
          items:
            $ref: '#/components/schemas/UserContext'
        analysis_status:
          type: string
          enum: [complete, partial, unavailable]
    UserContext:
      type: object
      required: [id, created_at, text]
      properties:
        id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        text:
          type: string
          minLength: 1
          description: Exactly one non-empty line after trimming.
    UserContextInput:
      type: object
      properties:
        text:
          type: [string, 'null']
          maxLength: 500
          description: One line to add/update, or null/empty to remove.
    Settings:
      type: object
      required: [workspace_path, theme, model_path, model_executable]
      properties:
        workspace_path:
          type: string
        theme:
          type: string
          enum: [system, light, dark]
        model_path:
          type: [string, 'null']
        model_executable:
          type: string
    SettingsPatch:
      type: object
      properties:
        theme:
          type: string
          enum: [system, light, dark]
        model_path:
          type: [string, 'null']
        model_executable:
          type: string
    ReportConflict:
      type: object
      required: [conflict_id, date, external_markdown, external_report, generated_report, external_revision]
      properties:
        conflict_id:
          type: string
          format: uuid
        date:
          type: string
          format: date
        external_markdown:
          type: string
        external_report:
          $ref: '#/components/schemas/DailyReport'
        generated_report:
          $ref: '#/components/schemas/DailyReport'
        external_revision:
          type: string
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
        path:
          type: [string, 'null']
        recovery_action:
          type: [string, 'null']
